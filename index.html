
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Package Installer</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101317;
  --panel: #191e24;
  --panel-hover: #202730;
  --border: #303841;
  --text: #e8edf2;
  --muted: #929da9;
  --blue: #3b83d5;
  --blue-hover: #5599e8;
  --green: #65b98a;
  --red: #d36b6b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Arial, sans-serif;
  font-size: 14px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: min(1120px, calc(100% - 48px));
  margin: 0 auto;
  padding: 30px 0 24px;
}

/* Header */

.topbar {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid #426c9c;
  border-radius: 9px;
  color: #8db9e8;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
}

.brand-name {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.3px;
}

.brand-caption {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 16px;
}

.ip-control {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}

.ip-control input {
  width: 132px;
  padding: 8px 10px;
  color: var(--text);
  background: #12171c;
  border: 1px solid var(--border);
  border-radius: 5px;
  outline: none;
  font-family: monospace;
  font-size: 13px;
}

.ip-control input:focus {
  border-color: var(--blue);
}

.languages {
  display: flex;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #14191e;
}

.lang-btn {
  padding: 5px 7px;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 4px;
  font-size: 11px;
}

.lang-btn.active {
  color: var(--text);
  background: #303943;
}

/* Main layout */

.main {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 22px;
  margin-top: 26px;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.action {
  width: 100%;
  min-height: 76px;
  padding: 15px 16px;
  text-align: left;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  transition: background .15s, border-color .15s;
}

.action:hover {
  background: var(--panel-hover);
  border-color: #536273;
}

.action.primary {
  background: #245d99;
  border-color: #3478bd;
}

.action.primary:hover {
  background: #2c70b4;
}

.action:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.action-title {
  display: block;
  font-weight: 600;
  font-size: 14px;
}

.action-description {
  display: block;
  margin-top: 5px;
  color: #b4c0cc;
  font-size: 12px;
  font-weight: 400;
}

/* Queue */

.queue-panel {
  min-width: 0;
  min-height: 380px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
}

.queue-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 17px 19px;
  border-bottom: 1px solid var(--border);
}

.queue-heading h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}

.queue-count {
  color: var(--muted);
  font-size: 12px;
  font-family: monospace;
}

#fileList {
  list-style: none;
  margin: 0;
  padding: 5px 17px;
  max-height: 480px;
  overflow-y: auto;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 66px;
  padding: 12px 3px;
  border-bottom: 1px solid #2b323a;
}

.file-item:last-child {
  border-bottom: 0;
}

.file-icon {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  color: #91b9e3;
  background: #243446;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
}

.file-info {
  flex: 1;
  min-width: 0;
}

.file-name {
  overflow: hidden;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-details {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
  font-family: monospace;
}

.file-progress {
  width: 100%;
  height: 3px;
  margin-top: 8px;
  overflow: hidden;
  background: #303943;
  border-radius: 3px;
}

.file-progress-fill {
  width: 0;
  height: 100%;
  background: var(--blue);
  transition: width .35s linear;
}

.file-status {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 11px;
}

.file-status.active {
  color: #8db9e8;
}

.file-status.done {
  color: var(--green);
}

.remove-btn {
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
  color: #87919c;
  background: transparent;
  border: 0;
  border-radius: 4px;
  font-size: 18px;
  line-height: 1;
}

.remove-btn:hover {
  color: #fff;
  background: #493033;
}

.remove-btn:disabled {
  opacity: .35;
  cursor: wait;
}

.empty {
  padding: 42px 10px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

/* Footer */

.statusbar {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-top: 20px;
  padding: 13px 15px;
  color: var(--muted);
  background: #171c22;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.status-indicator {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  margin-top: 5px;
  background: #65b98a;
  border-radius: 50%;
}

#log {
  min-width: 0;
  line-height: 1.5;
  overflow-wrap: anywhere;
  font-size: 12px;
}

@media (max-width: 760px) {
  .app {
    width: calc(100% - 28px);
    padding-top: 18px;
  }

  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .top-controls {
    width: 100%;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .main {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .action {
    min-height: 86px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">PS4</div>
      <div>
        <div class="brand-name">Remote Package Installer</div>
        <div class="brand-caption">Local package transfer</div>
      </div>
    </div>

    <div class="top-controls">
      <div class="ip-control">
        <label for="ps4ip" data-i18n="ipLabel">IP консоли</label>
        <input id="ps4ip" type="text" value="192.168.2.10">
      </div>

      <div class="languages">
        <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">RU</button>
        <button class="lang-btn" data-lang="uk" onclick="setLang('uk')">UA</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <button class="action" id="pickButton" onclick="pickFiles()">
        <span class="action-title" data-i18n="pickTitle">Выбрать пакеты</span>
        <span class="action-description" data-i18n="pickDescription">
          Добавить PKG-файлы в очередь
        </span>
      </button>

      <button class="action primary" id="sendButton" onclick="sendFiles()">
        <span class="action-title" data-i18n="sendTitle">Установить на PS4</span>
        <span class="action-description" data-i18n="sendDescription">
          Начать передачу выбранных пакетов
        </span>
      </button>
    </aside>

    <section class="queue-panel">
      <div class="queue-heading">
        <h2 data-i18n="queueTitle">Выбранные пакеты</h2>
        <span class="queue-count" id="queueCount">0</span>
      </div>

      <ul id="fileList">
        <li class="empty" data-i18n="emptyList">Очередь пуста</li>
      </ul>
    </section>
  </main>

  <footer class="statusbar">
    <span class="status-indicator"></span>
    <div id="log">Готов к работе.</div>
  </footer>

</div>

<script>
const I18N = {
  ru: {
    ipLabel: "IP консоли",
    pickTitle: "Выбрать пакеты",
    pickDescription: "Добавить PKG-файлы в очередь",
    sendTitle: "Установить на PS4",
    sendDescription: "Начать передачу выбранных пакетов",
    queueTitle: "Выбранные пакеты",
    emptyList: "Очередь пуста",
    ready: "Готов к работе.",
    picking: "Ожидание выбора файлов...",
    picked: "Добавлено пакетов: ",
    sending: "Отправка команды на PS4...",
    sent: "Команда отправлена. Ожидание передачи...",
    removing: "Удаление пакета...",
    removed: "Пакет удалён из очереди.",
    error: "Ошибка: ",
    invalidIp: "Введите корректный IP-адрес.",
    noFiles: "Сначала выберите пакеты.",
    waiting: "Ожидание",
    transferring: "Передача",
    completed: "Передано",
    remove: "Удалить пакет",
    speed: "МБ/с"
  },
  uk: {
    ipLabel: "IP консолі",
    pickTitle: "Вибрати пакети",
    pickDescription: "Додати PKG-файли до черги",
    sendTitle: "Встановити на PS4",
    sendDescription: "Почати передачу вибраних пакетів",
    queueTitle: "Вибрані пакети",
    emptyList: "Черга порожня",
    ready: "Готовий до роботи.",
    picking: "Очікування вибору файлів...",
    picked: "Додано пакетів: ",
    sending: "Надсилання команди на PS4...",
    sent: "Команду надіслано. Очікування передачі...",
    removing: "Видалення пакета...",
    removed: "Пакет видалено з черги.",
    error: "Помилка: ",
    invalidIp: "Введіть коректну IP-адресу.",
    noFiles: "Спочатку виберіть пакети.",
    waiting: "Очікування",
    transferring: "Передача",
    completed: "Передано",
    remove: "Видалити пакет",
    speed: "МБ/с"
  },
  en: {
    ipLabel: "Console IP",
    pickTitle: "Select packages",
    pickDescription: "Add PKG files to the queue",
    sendTitle: "Install to PS4",
    sendDescription: "Start transferring selected packages",
    queueTitle: "Selected packages",
    emptyList: "Queue is empty",
    ready: "Ready.",
    picking: "Waiting for file selection...",
    picked: "Packages added: ",
    sending: "Sending command to PS4...",
    sent: "Command sent. Waiting for transfer...",
    removing: "Removing package...",
    removed: "Package removed from queue.",
    error: "Error: ",
    invalidIp: "Enter a valid IP address.",
    noFiles: "Select packages first.",
    waiting: "Waiting",
    transferring: "Transferring",
    completed: "Transferred",
    remove: "Remove package",
    speed: "MB/s"
  }
};

let currentLang = localStorage.getItem("ps4_rpi_lang") || "ru";
let currentFiles = [];
let isBusy = false;
let progressTimer = null;
let progressStarted = false;
let emptyPolls = 0;

const elements = {
  ip: document.getElementById("ps4ip"),
  list: document.getElementById("fileList"),
  count: document.getElementById("queueCount"),
  log: document.getElementById("log"),
  pick: document.getElementById("pickButton"),
  send: document.getElementById("sendButton")
};

elements.ip.value = localStorage.getItem("ps4_rpi_ip") || "192.168.2.10";

elements.ip.addEventListener("change", () => {
  localStorage.setItem("ps4_rpi_ip", elements.ip.value.trim());
});

function t(key) {
  return I18N[currentLang][key] || I18N.ru[key] || key;
}

function setLog(message) {
  elements.log.textContent = message;
}

function setBusy(value) {
  isBusy = value;
  elements.pick.disabled = value;
  elements.send.disabled = value;
}

function setLang(lang) {
  if (!I18N[lang]) return;

  currentLang = lang;
  localStorage.setItem("ps4_rpi_lang", lang);
  document.documentElement.lang = lang;

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.lang === lang);
  });

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    if (I18N[lang][key]) element.textContent = I18N[lang][key];
  });

  renderEmptyState();
  updateCount();
}

function basename(path) {
  return String(path).split(/[\\/]/).pop();
}

function formatBytes(bytes) {
  const gb = bytes / (1024 ** 3);
  if (gb >= 1) return gb.toFixed(2) + " GB";

  const mb = bytes / (1024 ** 2);
  return mb.toFixed(1) + " MB";
}

function updateCount() {
  elements.count.textContent = currentFiles.length;
}

function renderEmptyState() {
  if (currentFiles.length !== 0) return;

  elements.list.replaceChildren();

  const empty = document.createElement("li");
  empty.className = "empty";
  empty.textContent = t("emptyList");
  elements.list.appendChild(empty);
}

function createFileRow(path) {
  const li = document.createElement("li");
  li.className = "file-item";
  li.dataset.path = path;

  const icon = document.createElement("div");
  icon.className = "file-icon";
  icon.textContent = "PKG";

  const info = document.createElement("div");
  info.className = "file-info";

  const name = document.createElement("div");
  name.className = "file-name";
  name.textContent = basename(path);
  name.title = path;

  const details = document.createElement("div");
  details.className = "file-details";
  details.textContent = t("waiting");

  const progress = document.createElement("div");
  progress.className = "file-progress";

  const fill = document.createElement("div");
  fill.className = "file-progress-fill";
  progress.appendChild(fill);

  info.append(name, details, progress);

  const status = document.createElement("span");
  status.className = "file-status";
  status.textContent = t("waiting");

  const remove = document.createElement("button");
  remove.className = "remove-btn";
  remove.type = "button";
  remove.textContent = "×";
  remove.title = t("remove");
  remove.setAttribute("aria-label", t("remove"));
  remove.addEventListener("click", () => removeFile(path, li, remove));

  li.append(icon, info, status, remove);

  li._ui = { details, fill, status, remove };
  return li;
}

function renderFiles() {
  elements.list.replaceChildren();

  for (const path of currentFiles) {
    elements.list.appendChild(createFileRow(path));
  }

  renderEmptyState();
  updateCount();
}

function updateFileProgress(path, item) {
  const rows = elements.list.querySelectorAll(".file-item");
  let row = null;

  for (const candidate of rows) {
    if (candidate.dataset.path === path) {
      row = candidate;
      break;
    }
  }

  if (!row || !row._ui) return;

  const ui = row._ui;
  const total = Number(item.total) || 0;
  const sent = Number(item.sent) || 0;
  const percent = total > 0
    ? Math.min(100, Math.max(0, sent / total * 100))
    : 0;

  ui.fill.style.width = percent.toFixed(1) + "%";

  if (item.done) {
    ui.details.textContent = formatBytes(total);
    ui.status.textContent = t("completed");
    ui.status.className = "file-status done";
    return;
  }

  ui.details.textContent =
    formatBytes(sent) + " / " + formatBytes(total) +
    " (" + Math.floor(percent) + "%) · " +
    (Number(item.speed) || 0).toFixed(1) + " " + t("speed");

  ui.status.textContent = t("transferring");
  ui.status.className = "file-status active";
}

async function readResponse(response) {
  const text = await response.text();

  let data;
  try {
    data = JSON.parse(text);
  } catch {
    throw new Error("Некорректный ответ сервера: " + text.slice(0, 200));
  }

  if (!response.ok) {
    throw new Error(data.err || response.statusText);
  }

  return data;
}

async function pickFiles() {
  if (isBusy) return;

  setBusy(true);
  setLog(t("picking"));

  try {
    const response = await fetch("/api/pick", { cache: "no-store" });
    const data = await readResponse(response);

    currentFiles = Array.isArray(data.files) ? data.files : [];
    renderFiles();

    setLog(t("picked") + currentFiles.length);
  } catch (error) {
    setLog(t("error") + error.message);
  } finally {
    setBusy(false);
  }
}

function validIp(ip) {
  const parts = ip.split(".");
  return parts.length === 4 && parts.every(part => {
    if (!/^\d{1,3}$/.test(part)) return false;
    const n = Number(part);
    return n >= 0 && n <= 255;
  });
}

async function removeFile(path, row, button) {
  if (button.disabled) return;

  button.disabled = true;

  try {
    const response = await fetch("/api/remove", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path })
    });

    const data = await readResponse(response);

    if (!data.ok) {
      throw new Error(data.err || "Remove failed");
    }

    currentFiles = currentFiles.filter(file => file !== path);
    row.remove();

    renderEmptyState();
    updateCount();

    setLog(t("removed"));
  } catch (error) {
    button.disabled = false;
    setLog(t("error") + error.message);
  }
}

function stopProgressPolling() {
  if (progressTimer) {
    clearTimeout(progressTimer);
    progressTimer = null;
  }
}

function startProgressPolling() {
  stopProgressPolling();

  progressStarted = false;
  emptyPolls = 0;

  pollProgress();
}

async function pollProgress() {
  try {
    const response = await fetch("/api/progress", {
      cache: "no-store"
    });

    const progress = await readResponse(response);
    const entries = Object.values(progress || {});

    if (entries.length > 0) {
      progressStarted = true;
      emptyPolls = 0;

      for (const item of entries) {
        if (!item || !item.name) continue;

        const matchingPath = currentFiles.find(path =>
          basename(path) === item.name
        );

        if (!matchingPath) continue;

        updateFileProgress(matchingPath, item);

        if (item.done) {
          // Сервер также удаляет успешно переданный файл
          // из SELECTED_FILES. Убираем его и из интерфейса.
          currentFiles = currentFiles.filter(path => path !== matchingPath);

          const row = [...elements.list.querySelectorAll(".file-item")]
            .find(el => el.dataset.path === matchingPath);

          if (row) row.remove();

          renderEmptyState();
          updateCount();
        }
      }
    } else {
      emptyPolls++;
    }
  } catch (error) {
    // Временные ошибки опроса не должны ломать передачу.
  }

  if (currentFiles.length === 0) {
    stopProgressPolling();
    return;
  }

  // Если сервер больше не сообщает о передаче,
  // не опрашиваем его бесконечно.
  if (progressStarted && emptyPolls >= 12) {
    stopProgressPolling();
    return;
  }

  // Ограничение на случай, если передача так и не началась.
  if (!progressStarted && emptyPolls >= 120) {
    stopProgressPolling();
    return;
  }

  progressTimer = setTimeout(pollProgress, 1000);
}

async function sendFiles() {
  if (isBusy) return;

  if (currentFiles.length === 0) {
    setLog(t("noFiles"));
    return;
  }

  const ip = elements.ip.value.trim();

  if (!validIp(ip)) {
    setLog(t("invalidIp"));
    elements.ip.focus();
    return;
  }

  localStorage.setItem("ps4_rpi_ip", ip);

  setBusy(true);
  setLog(t("sending"));

  startProgressPolling();

  try {
    const response = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ip })
    });

    const data = await readResponse(response);

    if (!data.ok) {
      throw new Error(data.err || "Transfer failed");
    }

    setLog(t("sent"));
  } catch (error) {
    setLog(t("error") + error.message);
    stopProgressPolling();
  } finally {
    setBusy(false);
  }
}

setLang(currentLang);
renderFiles();
</script>
</body>
</html>
